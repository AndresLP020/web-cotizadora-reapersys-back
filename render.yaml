# Blueprint de Render para la API de ReaperSys (NestJS + MongoDB Atlas).
# Render → New → Blueprint → este repositorio. Las variables con `sync: false`
# se capturan en el panel de Render durante la creación (nunca se versionan).
services:
  - type: web
    name: reapersys-api
    runtime: node
    # starter: siempre encendido (los recordatorios de pago se revisan cada hora).
    # free funciona, pero se duerme tras 15 min sin visitas y pausa los recordatorios.
    plan: starter
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/main.js
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      # Delante de la API están el proxy de Vercel y el balanceador de Render.
      - key: TRUST_PROXY
        value: "2"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: reapersys
      - key: SESSION_SECRET
        generateValue: true
      # URL pública del frontend en Vercel (o el dominio propio), sin "/" final.
      - key: PUBLIC_APP_URL
        sync: false
      # Orígenes permitidos (https), separados por coma; normalmente igual a PUBLIC_APP_URL.
      - key: CORS_ORIGINS
        sync: false
      # "resend" (envía de verdad; exige RESEND_API_KEY) o "simulated" (registra sin enviar).
      - key: EMAIL_PROVIDER
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # Remitente con el dominio verificado en Resend, p. ej. "ReaperSys <avisos@tudominio.com>".
      - key: EMAIL_FROM
        sync: false
      # Correo que recibe avisos internos y el resumen diario de cobranza.
      - key: EMAIL_ADMIN_NOTIFY
        sync: false
      - key: BILLING_REMINDERS_ENABLED
        value: "true"
      - key: BILLING_REMINDER_DAYS_BEFORE
        value: 5,1,0
      - key: BILLING_REMINDER_DAYS_AFTER
        value: 1,7,15
      - key: BILLING_REMINDER_HOUR
        value: "9"
